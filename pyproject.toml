[project]
name = "slm-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felipe", email = "lfc.ladeira@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "protobuf>=7.36.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "trl>=1.13.0",
    "typer>=0.27.2",
]

[project.scripts]
slm-learn = "slm_learn.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
